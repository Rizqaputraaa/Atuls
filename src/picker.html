<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #loupe { position: fixed; width: 132px; height: 132px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #000, 0 6px 20px #0008; overflow: hidden; pointer-events: none; display: none; }
  #loupe canvas { position: static; width: 100%; height: 100%; image-rendering: pixelated; }
  #loupe::after { content: ''; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 2px solid #fff; box-shadow: 0 0 0 1px #000; box-sizing: border-box; }
  #tag { position: fixed; padding: 4px 9px; border-radius: 10px; background: #000d; color: #fff; font: 600 13px -apple-system, "Segoe UI", sans-serif; pointer-events: none; display: none; white-space: nowrap; }
  #tag i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid #fff8; }
  #help { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 14px; background: #000b; color: #fff; font: 13px -apple-system, "Segoe UI", sans-serif; pointer-events: none; }
</style>
<canvas id="shot"></canvas>
<div id="loupe"><canvas id="zoom" width="11" height="11"></canvas></div>
<div id="tag"><i></i><span></span></div>
<div id="help">Click to copy the color &nbsp;&middot;&nbsp; Esc to cancel</div>
<script>
const shot = document.getElementById('shot'), zoom = document.getElementById('zoom');
const sctx = shot.getContext('2d', { willReadFrequently: true }), zctx = zoom.getContext('2d');
const loupe = document.getElementById('loupe'), tag = document.getElementById('tag');
let ready = false;
const hexAt = (x, y) => { const d = sctx.getImageData(x, y, 1, 1).data; return '#' + [d[0], d[1], d[2]].map((v) => v.toString(16).padStart(2, '0')).join('').toUpperCase(); };
window.picker.onInit((src) => {
  const img = new Image();
  img.onload = () => { shot.width = img.width; shot.height = img.height; sctx.drawImage(img, 0, 0); ready = true; window.picker.ready(); };
  img.src = src;
});
addEventListener('mousemove', (e) => {
  if (!ready) return;
  const k = shot.width / innerWidth;
  const px = Math.max(0, Math.min(shot.width - 1, Math.floor(e.clientX * k))), py = Math.max(0, Math.min(shot.height - 1, Math.floor(e.clientY * k)));
  // 11 x 11 pixels around the pointer, enlarged
  zctx.clearRect(0, 0, 11, 11);
  zctx.drawImage(shot, px - 5, py - 5, 11, 11, 0, 0, 11, 11);
  const flipX = e.clientX > innerWidth - 190, flipY = e.clientY > innerHeight - 220;
  loupe.style.display = tag.style.display = 'block';
  loupe.style.left = (flipX ? e.clientX - 160 : e.clientX + 24) + 'px'; loupe.style.top = (flipY ? e.clientY - 170 : e.clientY + 24) + 'px';
  const hex = hexAt(px, py);
  tag.querySelector('span').textContent = hex; tag.querySelector('i').style.background = hex;
  tag.style.left = (flipX ? e.clientX - 160 : e.clientX + 24) + 'px'; tag.style.top = (flipY ? e.clientY - 200 : e.clientY + 164) + 'px';
});
addEventListener('mousedown', (e) => {
  if (!ready) return;
  if (e.button !== 0) return window.picker.done(null);
  const k = shot.width / innerWidth;
  window.picker.done(hexAt(Math.max(0, Math.min(shot.width - 1, Math.floor(e.clientX * k))), Math.max(0, Math.min(shot.height - 1, Math.floor(e.clientY * k)))));
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.done(null); });
addEventListener('contextmenu', (e) => e.preventDefault());
</script>
