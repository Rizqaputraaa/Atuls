<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; }
  #box { position: absolute; left: 6px; top: 6px; width: 118px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #lens { width: 110px; height: 110px; border-radius: 12px; overflow: hidden; border: 2px solid #fff; box-shadow: 0 0 0 1px #000a, 0 8px 24px #0008; background: #000; position: relative; }
  #lens canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #lens::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 1.5px solid #fff; box-shadow: 0 0 0 1px #000; }
  #tag { display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 10px; background: #111114f2; border: 1px solid #ffffff30; box-shadow: 0 6px 18px #0008; white-space: nowrap; letter-spacing: .02em; }
  #tag i { width: 16px; height: 16px; border-radius: 5px; border: 1px solid #ffffff90; }
</style>
<div id="box"><div id="lens"><canvas id="cv" width="11" height="11"></canvas></div><div id="tag"><i id="sw"></i><span id="hex">#000000</span></div></div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), sw = document.getElementById('sw'), hex = document.getElementById('hex');
const img = ctx.createImageData(11, 11);
window.loupe.onFrame(({ grid, text }) => {
  for (let i = 0, p = 0, q = 0; i < 121; i++, p += 3, q += 4) { img.data[q] = grid[p]; img.data[q + 1] = grid[p + 1]; img.data[q + 2] = grid[p + 2]; img.data[q + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  sw.style.background = text; hex.textContent = text;
});
</script>
