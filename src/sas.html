<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Island Link - confirm pairing</title>
<style>
  :root { color-scheme: dark; --bg: #141416; --fg: #f2f2f4; --mut: #9b9ba3; --ok: #30d158; --bad: #ff453a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 24px; box-sizing: border-box; text-align: center; user-select: none; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  p { margin: 0; color: var(--mut); }
  #code { font-size: 44px; font-weight: 700; letter-spacing: 6px; margin: 16px 0 18px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 10px; width: 100%; }
  button { flex: 1; padding: 10px 0; border-radius: 10px; border: 0; font: inherit; font-weight: 600; cursor: pointer; color: var(--fg); background: #2a2a2e; }
  button:hover { background: #343439; }
  #yes { background: var(--ok); color: #04210d; }
  #yes:hover { background: #4be07a; }
  #no { color: var(--bad); }
  small { display: block; margin-top: 12px; color: var(--mut); font-size: 12px; }
</style>
</head>
<body>
  <h1 id="title">Confirm pairing</h1>
  <p id="sub">Look at the other computer. Do you see the same numbers?</p>
  <div id="code">--- ---</div>
  <div class="row"><button id="no">Different</button><button id="yes">They match</button></div>
  <small>Different numbers mean someone else may be on your network. Choose Different.</small>
<script>
  const $ = (id) => document.getElementById(id);
  window.sas.onShow((d) => {
    $('code').textContent = d.code.slice(0, 3) + ' ' + d.code.slice(3);
    $('title').textContent = d.name ? 'Pairing with ' + d.name : 'Confirm pairing';
  });
  $('yes').onclick = () => window.sas.answer(true);
  $('no').onclick = () => window.sas.answer(false);
</script>
</body>
</html>
