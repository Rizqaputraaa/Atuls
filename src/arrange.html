<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Arrange screens</title>
<style>
  :root { --bg: #0b0f17; --panel: #121826; --line: #243049; --fg: #e8ecf5; --dim: #8b97b0; --accent: #4f8cff; }
  * { box-sizing: border-box; margin: 0; user-select: none; }
  body { background: var(--bg); color: var(--fg); font: 14px "Segoe UI", -apple-system, system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 24px 8px; }
  h1 { font-size: 18px; }
  header p { color: var(--dim); margin-top: 4px; }
  #stage { position: relative; flex: 1; margin: 12px 24px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background-color: var(--panel); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 28px 28px; }
  .disp { position: absolute; border: 2px solid #4a5a7d; border-radius: 8px; background: linear-gradient(#2a3a5c, #1b2740); cursor: grab; overflow: hidden; }
  .disp.self { border-color: var(--accent); background: linear-gradient(#3a5a95, #223a66); }
  .disp.drag { cursor: grabbing; box-shadow: 0 0 0 2px rgba(79,140,255,.35); }
  .disp .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 6px; text-align: center; font-weight: 600; font-size: 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.65)); pointer-events: none; }
  .disp .label small { display: block; color: var(--dim); font-size: 10px; letter-spacing: .06em; font-weight: 500; }
  footer { padding: 0 24px 16px; color: var(--dim); font-size: 12px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Arrange your computers</h1>
  <p>Drag a computer to choose where the cursor crosses. Edges snap together; the cursor only crosses where two screens touch.</p>
</header>
<div id="stage"><div id="empty">Connect to another computer first</div></div>
<footer id="info"></footer>
<script src="arrange.js"></script>
</body>
</html>
