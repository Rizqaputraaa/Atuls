<!doctype html>
<html><head><meta charset="utf-8"><title>Look to switch - camera preview</title>
<style>
  html, body { margin: 0; background: #000; color: #f2f2f7; font: 13px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #wrap { width: 320px; }
  video { display: none; }
  canvas { display: block; width: 320px; transform: scaleX(-1); }
  #info { padding: 8px 10px; }
  #info b { color: #30d158; } #info.no b { color: #ff453a; }
</style></head>
<body>
<div id="wrap"><video id="v" muted playsinline></video><canvas id="c" width="320" height="240"></canvas></div>
<div id="info" class="no"><b>No face</b> <span id="yaw"></span></div>
<script type="module" src="gaze-tracker.js"></script>
</body></html>
