<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>A-tuls - Settings</title>
<style>
  :root { --bg: #141416; --panel: #1c1c1f; --panel2: #232327; --line: #2f2f34; --fg: #f2f2f7; --dim: #9a9aa2; --accent: #0a84ff; --good: #30d158; --bad: #ff453a; --ease: cubic-bezier(.32, .72, 0, 1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  html, body { overflow: hidden; } /* only the page (main) scrolls: one scrollbar, not two */
  #app { display: flex; height: 100vh; overflow: hidden; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #3a3a3f; border-radius: 4px; }
  main::-webkit-scrollbar-track { background: transparent; }
  aside { overflow-y: auto; width: 210px; flex: none; background: #101012; border-right: 1px solid var(--line); padding: 22px 12px 16px; display: flex; flex-direction: column; }
  aside h1 { font-size: 16px; padding: 0 10px 12px; }
  .search { width: 100%; margin: 0 0 12px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: #1b1b1e; color: var(--fg); font: inherit; font-size: 13px; outline: none; }
  .search:focus { border-color: var(--accent); }
  aside button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; margin-bottom: 3px; border: 0; border-radius: 10px; background: transparent; color: var(--dim); font: inherit; font-size: 13.5px; cursor: pointer; text-align: left; }
  aside button:hover { background: #1b1b1e; color: var(--fg); }
  aside button.on { background: var(--accent); color: #fff; }
  aside button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  aside .grp { color: #6f6f78; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 14px 12px 6px; }
  aside .foot { margin-top: auto; padding: 10px; color: var(--dim); font-size: 11px; display: flex; align-items: center; gap: 8px; }
  aside .foot img { width: 16px; opacity: .7; }
  main { flex: 1; min-width: 0; height: 100%; overflow-y: auto; padding: 26px 34px 40px; }
  main h2 { font-size: 20px; margin-bottom: 4px; }
  main .sub { color: var(--dim); margin-bottom: 20px; }
  .group { color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin: 22px 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 18px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-weight: 600; font-size: 14px; }
  .row .t span { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  .row.off { opacity: .45; pointer-events: none; }
  .seg { display: flex; gap: 3px; background: #121214; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--dim); padding: 6px 14px; border-radius: 8px; font: inherit; cursor: pointer; }
  .seg button.on { background: #2f2f36; color: var(--fg); }
  .slider { display: flex; align-items: center; gap: 12px; width: 280px; }
  .slider input { flex: 1; accent-color: var(--accent); }
  .slider output { min-width: 52px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  button.btn { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 14px; font: inherit; cursor: pointer; }
  button.btn:hover { background: #2c2c32; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); }
  button.btn.danger { color: var(--bad); }
  button.keychip { min-width: 128px; font-weight: 600; }
  button.keychip.empty { color: var(--dim); }
  button.keychip.rec { border-color: var(--accent); color: var(--accent); }
  .hkrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .hkrow:first-child { border-top: 0; }
  .hkrow .arrow { color: var(--dim); }
  .hkrow .x { margin-left: auto; }
  button.ico { background: transparent; border: 0; color: var(--dim); cursor: pointer; padding: 4px 8px; border-radius: 7px; font-size: 14px; }
  button.ico:hover { background: #2a2a30; color: var(--fg); }
  input.txt, select { background: #121214; color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font: inherit; min-width: 0; }
  input.txt:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* preview */
  #preview { position: relative; height: 300px; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #1f3a2a, #0c1410 70%); border: 1px solid var(--line); overflow: hidden; margin-bottom: 14px; }
  #preview .c, #preview .i { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all .25s var(--ease); }
  #preview .c { background: #0b0b0e; border: 1px solid #ffffff30; }
  #preview .c img { width: 50%; }
  #preview .i { background: #17171bf2; border: 1px solid #ffffff30; color: #f2f2f7; box-shadow: 0 6px 18px #0008; }
  #preview .i.sq { border-radius: 28%; }
  #preview svg { width: 45%; height: 45%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #preview .tag { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: #0b0b0ef0; border: 1px solid #ffffff22; border-radius: 12px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
  /* items and workspaces */
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .item + .item { border-top: 1px solid var(--line); }
  .item .pic { width: 32px; height: 32px; border-radius: 9px; background: #121214; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
  .item .pic img { width: 22px; height: 22px; }
  .head .pic { width: 32px; height: 32px; border-radius: 9px; background: #121214; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
  .head .pic img { width: 22px; height: 22px; }
  .head .pic svg { width: 18px; height: 18px; fill: none; stroke: var(--dim); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .item .pic.click, .head .pic.click { cursor: pointer; }
  .item .pic.click:hover, .head .pic.click:hover { border-color: #0a84ff; }
  .item .pic svg { width: 18px; height: 18px; fill: none; stroke: var(--dim); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .item .nm { flex: 1; min-width: 0; }
  .item .kind { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .ws { margin-bottom: 14px; }
  .ws .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .ws .head input { flex: 1; font-weight: 600; font-size: 14px; }
  .adders { display: flex; gap: 8px; padding: 12px 14px; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .inline { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .inline .hits { display: flex; flex-direction: column; max-height: 220px; overflow: auto; }
  .hit { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .hit:hover { background: #2a2a30; }
  .hit img { width: 22px; height: 22px; }
  .hit .ph { width: 22px; height: 22px; border-radius: 6px; background: #2a2a30; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .note { color: var(--dim); font-size: 12px; padding: 10px 14px; }
  .sw { width: 42px; height: 24px; border-radius: 12px; background: #3a3a40; border: 0; position: relative; cursor: pointer; flex: none; transition: background .2s; }
  .sw i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .2s var(--ease); }
  .sw.on { background: var(--good); }
  .sw.on i { left: 21px; }
  select.big { min-width: 210px; }
  .banner { background: #3a2a10; border: 1px solid #6b4a14; color: #ffcc66; border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; }
  .swatch { width: 34px; height: 34px; border-radius: 10px; border: 1px solid #ffffff30; cursor: pointer; padding: 0; position: relative; }
  .swatch:hover::after { content: attr(title); position: absolute; left: 50%; top: -26px; transform: translateX(-50%); background: #000; color: #fff; padding: 2px 7px; border-radius: 7px; font-size: 11px; white-space: nowrap; }
  .swatch.copied { outline: 2px solid var(--good); }
  .msg { color: var(--dim); font-size: 12px; }
  .toast { position: fixed; right: 22px; bottom: 20px; background: #111114; border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; opacity: 0; transform: translateY(8px); transition: all .25s var(--ease); pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Settings</h1>
    <input id="q" class="search" placeholder="Search settings" autocomplete="off" spellcheck="false">
    <button data-p="general"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>General</button>
    <div class="grp">Input</div>
    <button data-p="pointer"><svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg>Pointer &amp; switching</button>
    <button data-p="scrolling"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v4"/></svg>Scrolling</button>
    <button data-p="trackpad"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M12 9v6M9 12h6"/></svg>Trackpad scroll</button>
    <button data-p="buttons"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>Mouse buttons</button>
    <button data-p="shortcuts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>Keyboard shortcuts</button>
    <div class="grp">Radial menu</div>
    <button data-p="activation"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="2.5"/></svg>Activation</button>
    <button data-p="appearance"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>Appearance</button>
    <button data-p="workspaces"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Wheel &amp; workspaces</button>
    <div class="grp">Tools</div>
    <button data-p="color"><svg viewBox="0 0 24 24"><path d="M14.5 5.5l4 4"/><path d="M16.5 3.5a2 2 0 0 1 3 3l-2 2-3-3z"/><path d="M14.5 8.5L5 18l-1 3 3-1 9.5-9.5"/></svg>Color picker</button>
    <button data-p="sharing"><svg viewBox="0 0 24 24"><path d="M4 12v7h16v-7M12 3v12M7 8l5-5 5 5"/></svg>Sharing</button>
    <button data-p="calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-p="diagnostics"><svg viewBox="0 0 24 24"><path d="M4 18l4-6 3 3 4-8 5 11"/></svg>Diagnostics</button>
    <div class="foot"><img src="assets/logo.png" alt="">A-tuls · this computer</div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast">Saved</div>
<script src="assets/wheel.js"></script>
<script>
const W = window.Wheel, $main = document.getElementById('main');
let S = null, page = 'activation', saveTimer = null;
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'html') el.innerHTML = v; else if (v === true) el.setAttribute(k, ''); else if (v !== false && v != null) el.setAttribute(k, v); }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1100); };
function save(rerender) {
  clearTimeout(saveTimer);
  // S.cfg stays the same object: the sliders and fields hold references into it (replacing it made later changes vanish)
  saveTimer = setTimeout(async () => { await window.rs.save(S.cfg); toast('Saved'); if (rerender) draw(); }, 250);
}
const seg = (opts, value, on) => h('div', { class: 'seg' }, opts.map(([v, label]) => h('button', { class: v === value ? 'on' : '', onclick: () => on(v) }, label)));
let U = { status: 'idle' };
const updText = () => ({ checking: 'Checking...', current: 'You have the latest version.', available: 'Version ' + U.latest + ' is available.', downloading: 'Downloading ' + (U.progress || 0) + '%...', ready: 'Version ' + U.latest + ' is ready. Restart to finish.', error: U.error || 'Could not check for updates.' }[U.status] || 'Looks for a newer version on its own; you can also check here.');
const row = (title, desc, control, cls) => h('div', { class: 'row ' + (cls || '') }, h('div', { class: 't' }, h('b', {}, title), desc ? h('span', {}, desc) : null), control);
const slider = (min, max, step, value, unit, on, fmt) => {
  const show = (v) => (fmt ? fmt(v) : v + unit);
  const out = h('output', {}, show(value));
  const inp = h('input', { type: 'range', min, max, step, value, oninput: () => { out.textContent = show(+inp.value); on(+inp.value); } });
  return h('div', { class: 'slider' }, inp, out);
};
const itemIcons = {}; const iconAsked = new Set(); // (icons of links and folders, asked for when first shown)
const iconKey = (it) => it.kind + '|' + (it.url || it.path) + '|' + (it.logo || '');
const iconOf = (it) => {
  if (it.kind === 'app' && S.icons[it.path] && !it.logo) return h('img', { src: S.icons[it.path], alt: '' });
  const k = iconKey(it);
  if (itemIcons[k]) return h('img', { src: itemIcons[k], alt: '' });
  if (!iconAsked.has(k)) { iconAsked.add(k); window.rs.itemIcon(it).then((u) => { if (u) { itemIcons[k] = u; if (page === 'workspaces') draw(); } }).catch(() => {}); }
  return h('span', { html: W.ICONS[it.kind] || W.ICONS.app });
};

// the icon of a wheel entry or a workspace: click it to choose a picture of your own (the arrow button next to it puts the normal one back)
const logoPic = (logo, fallback, set) => {
  const k = 'logo|' + logo;
  if (logo && !itemIcons[k] && !iconAsked.has(k)) { iconAsked.add(k); window.rs.itemIcon({ kind: 'logo', logo }).then((u) => { if (u) { itemIcons[k] = u; if (page === 'workspaces') draw(); } }).catch(() => {}); }
  return h('div', { class: 'pic click', title: 'Click to choose your own icon', onclick: async () => { const p = await window.rs.pickIcon(); if (p) set(p); } },
    logo && itemIcons[k] ? h('img', { src: itemIcons[k], alt: '' }) : h('span', { html: fallback }));
};
const logoReset = (logo, set) => (logo ? h('button', { class: 'ico', title: 'Back to the normal icon', onclick: () => set('') }, '↺') : null);

// ---------------------------------------------------------------- Activation
function pageActivation() {
  const t = S.trigger;
  return [
    h('h2', {}, 'Activation'), h('div', { class: 'sub' }, 'How the wheel opens. Press the trigger again, or the logo in the middle, to close it.'),
    h('div', { class: 'card' }, row('Use the radial menu', 'The wheel needs its own hidden window, which keeps about 100 MB of memory while it exists and a little processor time when it opens. Switch it off if you do not use it: nothing is created and nothing waits. When it is on, the window is released again a minute after the wheel was last used.', toggle(S.startup.radialOn !== false, async (v) => { S.startup = await A.startupSet({ radialOn: v }); toast('Saved'); }))),
    h('div', { class: 'group' }, 'Mouse'),
    h('div', { class: 'card' },
      row('Mouse trigger', 'Open the wheel with a mouse button. Side buttons are usually free; left and right stay with the system.',
        seg([['off', 'Off'], ['middle', 'Wheel'], ['back', 'Back'], ['forward', 'Forward']], t, async (v) => { S.trigger = await window.rs.trigger(v); S.map = await window.api.btnmapGet(); toast('Saved'); draw(); }))),
    h('div', { class: 'group' }, 'Try it'),
    h('div', { class: 'card' }, row('Open the wheel now', 'Shows the wheel under the pointer, as it will look when you press the trigger.', h('button', { class: 'btn primary', onclick: () => window.rs.test() }, 'Open'))),
  ];
}

// ---------------------------------------------------------------- Appearance (with a live preview)
function drawPreview(box) {
  const a = S.cfg.appearance, items = S.cfg.items.length ? S.cfg.items : [{ type: 'action', action: 'pickColor' }, { type: 'action', action: 'screenshot' }, { type: 'workspace' }];
  const { pos } = W.layout(items.length, a), cx = box.clientWidth / 2, cy = box.clientHeight / 2 - 14;
  const fit = 0.58; // one fixed scale, so a bigger radius or icon visibly grows (the biggest setting still fits)
  box.innerHTML = '';
  const place = (el, x, y, size) => { el.style.width = el.style.height = size + 'px'; el.style.left = (cx + x * fit - size / 2) + 'px'; el.style.top = (cy + y * fit - size / 2) + 'px'; box.append(el); };
  place(h('div', { class: 'c' }, h('img', { src: 'assets/logo.png', alt: '' })), 0, 0, a.icon * 1.3 * fit);
  items.forEach((it, i) => place(h('div', { class: 'i', html: W.ICONS[it.type === 'action' ? it.action : 'workspace'] || W.ICONS.none }), pos[i].x, pos[i].y, a.icon * fit));
  box.append(h('div', { class: 'tag' }, 'A-tuls · Center'));
}
function pageAppearance() {
  const a = S.cfg.appearance, box = h('div', { id: 'preview' });
  const upd = (k) => (v) => { a[k] = v; drawPreview(box); save(false); };
  setTimeout(() => drawPreview(box), 0);
  return [
    h('h2', {}, 'Appearance'), h('div', { class: 'sub' }, 'Size and spacing of the wheel. The preview follows your changes.'),
    box,
    h('div', { class: 'card' },
      row('Orbital radius', 'Distance from the centre to the items. It grows by itself when many items would touch.', slider(70, 200, 2, a.radius, ' px', upd('radius'))),
      row('Icon size', 'Visual weight of each target.', slider(40, 80, 1, a.icon, ' px', upd('icon'))),
      row('Target spacing', 'Minimum space between neighbouring items.', slider(0, 40, 1, a.spacing, ' px', upd('spacing')))),
    h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn', onclick: () => { S.cfg.appearance = { ...W.DEFAULTS }; save(true); } }, 'Reset appearance')),
  ];
}

// ---------------------------------------------------------------- Wheel & workspaces
const wsName = (id) => (S.cfg.workspaces.find((w) => w.id === id) || {}).name || 'Workspace';
function pageWorkspaces() {
  const cfg = S.cfg, L = S.limit;
  // the items on the main ring
  const ring = h('div', { class: 'card list' },
    cfg.items.map((it, i) => { const tgt = it.type === 'workspace' ? cfg.workspaces.find((w) => w.id === it.ws) : it, setLogo = (p) => { if (tgt) { tgt.logo = p; save(true); } }; return h('div', { class: 'item' },
      logoPic(tgt && tgt.logo, W.ICONS[it.type === 'action' ? it.action : 'workspace'], setLogo),
      h('select', { class: 'nm', onchange: (e) => { const v = e.target.value; cfg.items[i] = v.startsWith('a:') ? { type: 'action', action: v.slice(2) } : { type: 'workspace', ws: v.slice(2) }; save(true); } },
        h('optgroup', { label: 'Quick actions' }, S.actions.map((a) => h('option', { value: 'a:' + a.id, selected: it.type === 'action' && it.action === a.id }, a.label))),
        h('optgroup', { label: 'Workspaces' }, cfg.workspaces.map((w) => h('option', { value: 'w:' + w.id, selected: it.type === 'workspace' && it.ws === w.id }, w.name)))),
      logoReset(tgt && tgt.logo, setLogo),
      h('button', { class: 'ico', title: 'Move up', disabled: i === 0, onclick: () => { [cfg.items[i - 1], cfg.items[i]] = [cfg.items[i], cfg.items[i - 1]]; save(true); } }, '↑'),
      h('button', { class: 'ico', title: 'Move down', disabled: i === cfg.items.length - 1, onclick: () => { [cfg.items[i + 1], cfg.items[i]] = [cfg.items[i], cfg.items[i + 1]]; save(true); } }, '↓'),
      h('button', { class: 'ico', title: 'Remove', onclick: () => { cfg.items.splice(i, 1); save(true); } }, '✕')); }),

// type a name, click the app: no file dialog and no paths
function appForm(slot, add) {
  const hits = h('div', { class: 'hits' }), q = h('input', { class: 'txt', placeholder: 'Search installed apps (WhatsApp, Figma, Finder...)' });
  let timer = null;
  const run = async () => {
    const list = await window.rs.search(q.value);
    hits.innerHTML = '';
    for (const a of list) {
      S.icons[a.path] = a.icon;
      hits.append(h('div', { class: 'hit', onclick: () => add({ kind: 'app', path: a.path, name: a.name, logo: a.logo || '' }) }, a.icon ? h('img', { src: a.icon, alt: '' }) : h('div', { class: 'ph' }, a.name.slice(0, 1).toUpperCase()), a.name));
    }
    if (!list.length) hits.append(h('div', { class: 'note' }, 'No app found.'));
  };
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 150); });
  slot.innerHTML = ''; slot.append(h('div', { class: 'inline' }, q, hits));
  q.focus(); run();
}
function linkForm(slot, add) {
  const name = h('input', { class: 'txt', placeholder: 'Name (YouTube)' }), url = h('input', { class: 'txt', placeholder: 'https://www.youtube.com' });
  const go = () => {
    let u = url.value.trim();
    if (!/^(https?:\/\/|mailto:)/i.test(u)) u = 'https://' + u;
    if (!/^(https?:\/\/[^\s.]+\.[^\s]+|mailto:\S+)/i.test(u)) return toast('That does not look like a link');
    add({ kind: 'url', url: u, name: name.value.trim() });
  };
  url.addEventListener('keydown', (e) => e.key === 'Enter' && go());
  slot.innerHTML = ''; slot.append(h('div', { class: 'inline' }, h('div', { style: 'display:flex;gap:8px' }, name, url), h('div', {}, h('button', { class: 'btn primary', onclick: go }, 'Add link'))));
  name.focus();
}

// ---- key combinations: shown nicely, and recorded from this computer's keyboard
const isKeys = (v) => String(v || '').startsWith('keys:');
const KEYNAME = { Ctrl: MACOS ? 'Control' : 'Ctrl', Alt: MACOS ? 'Option' : 'Alt', Meta: MACOS ? 'Cmd' : 'Win', Shift: 'Shift', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Escape: 'Esc', BracketLeft: '[', BracketRight: ']', Minus: '-', Equal: '=', Comma: ',', Period: '.', Slash: '/', Backslash: '\\', Semicolon: ';', Quote: "'", Backquote: '`' };
const niceCombo = (c) => String(c || '').split('+').map((n) => KEYNAME[n] || n).join(' + ');
// one button that records the next key combination typed on this computer (Esc cancels; plain letters are not accepted)
function recorder(current, onDone, empty) {
  const label = () => (current ? niceCombo(current) : (empty || 'Record'));
  const b = h('button', { class: 'btn keychip' + (current ? '' : ' empty') }, label());
  b.onclick = async () => {
    b.textContent = 'Press the keys...'; b.classList.add('rec');
    A.log('settings: record a key combination');
    const c = await A.keysRecord();
    b.classList.remove('rec');
    if (c) onDone(c); else b.textContent = label();
  };
  return b;
}

          h('button', { class: 'btn', onclick: async () => { S.startup = await A.startupSet({ splashColors: { c1: '', c2: '' } }); toast('Back to the default colors'); draw(); } }, 'Reset'))),
      row('Pill position', 'Where the pill sits at the top of this screen. Right keeps it clear of the camera notch (MacBook) and of the browser tabs in the middle.',
        h('div', { class: 'seg' }, ...[['center', 'Center'], ['right', 'Right']].map(([v, l]) => h('button', { class: (((S.look && S.look.pillPos) || 'center') === v) ? 'on' : '', onclick: async () => { S.look = await A.lookPos(v); toast('Saved'); draw(); } }, l)))),
      row('Show the island', 'Hover: the panel opens when the pointer rests on the pill. Click: it opens when you click the pill, and closes when you click anywhere else.',
        h('div', { class: 'seg' }, ...[['hover', 'Hover'], ['click', 'Click']].map(([v, l]) => h('button', { class: (((S.look && S.look.openMode) || 'hover') === v) ? 'on' : '', onclick: async () => { S.look = await A.lookSet('openMode', v); toast('Saved'); draw(); } }, l)))),
      row('Tab buttons', 'The arrows at the left and right of the open island move to the previous and next tab. Hover: resting the pointer on an arrow moves one tab (leave the arrow and come back for the next). Click: press the arrow.',
        h('div', { class: 'seg' }, ...[['hover', 'Hover'], ['click', 'Click']].map(([v, l]) => h('button', { class: (((S.look && S.look.navMode) || 'hover') === v) ? 'on' : '', onclick: async () => { S.look = await A.lookSet('navMode', v); toast('Saved'); draw(); } }, l)))),
      row('Ignore media from', 'Words in the title, artist or program name of media that must NOT show as music: add instagram or tiktok and scrolling those pages in the browser no longer replaces the song (and its lyrics) that is playing.',
        h('div', { style: 'display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:300px' },
          h('div', { style: 'display:flex;gap:8px' },
            h('input', { class: 'txt', id: 'mb-in', placeholder: 'instagram', style: 'width:150px', onkeydown: async (e) => { if (e.key === 'Enter') document.getElementById('mb-add').click(); } }),
            h('button', { class: 'btn', id: 'mb-add', onclick: async () => { const v = document.getElementById('mb-in').value.trim(); if (!v) return; S.mediaBlock = await A.mediaBlockSet([...(S.mediaBlock || []), v]); toast('Saved'); draw(); } }, 'Add')),
          h('div', { style: 'display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end' }, ...(S.mediaBlock || []).map((w) => h('button', { class: 'btn', title: 'Remove', onclick: async () => { S.mediaBlock = await A.mediaBlockSet((S.mediaBlock || []).filter((x) => x !== w)); toast('Saved'); draw(); } }, w + ' \u2715'))))),
      row('Notification sounds', 'A short tone for each kind of notice: sent, received, connected, a problem and a screenshot. It stays silent while the pill is hidden in a game.',
        h('div', { style: 'display:flex;gap:10px;align-items:center' },
          h('input', { type: 'range', min: 0, max: 100, value: G.soundVol === undefined ? 60 : G.soundVol, style: 'width:110px', onchange: async (e) => { S.startup = await A.startupSet({ soundVol: Number(e.target.value) }); A.soundTest('ok'); } }),
          h('select', { class: 'txt', id: 'snd-kind' }, ...[['ok', 'Done'], ['sent', 'Sent'], ['received', 'Received'], ['connected', 'Connected'], ['err', 'Problem'], ['shot', 'Screenshot'], ['impact', 'Screen switch']].map(([v, l]) => h('option', { value: v }, l))),
          h('button', { class: 'btn', onclick: () => A.soundTest(document.getElementById('snd-kind').value) }, 'Play'),
          toggle(G.sound !== false, async (v) => { S.startup = await A.startupSet({ sound: v }); toast('Saved'); }))),
      row('Hide in games', 'The pill hides itself while a game or another full-screen program is in front (Dota, a full-screen video, a slideshow) and comes back when you leave it.', toggle(G.gameHide !== false, async (v) => { S.startup = await A.startupSet({ gameHide: v }); toast('Saved'); })),
      row('Hide the pill', 'Hide or show the pill by hand. The shortcut Ctrl+Alt+H and the tray icon menu do the same.', toggle(!!G.pillOff, async (v) => { S.startup = await A.startupSet({ pillOff: v }); toast('Saved'); })),
      row('Your picture', 'Shown in the top corner of the home page instead of the A-tuls logo. Click the picture there to change it too.',
        h('div', { style: 'display:flex;gap:10px;align-items:center' },
          h('button', { class: 'btn', onclick: async () => { await A.profileChoose(); toast('Saved'); } }, 'Choose picture'),
          h('button', { class: 'btn', onclick: async () => { await A.profileReset(); toast('Back to the logo'); } }, 'Use the logo'))),
      row('Decoration color', 'The glow under the music on the home page and the small accents around it.',
        h('div', { style: 'display:flex;gap:10px;align-items:center' },
          h('input', { type: 'color', value: (S.look && S.look.accent) || '#0a84ff', onchange: async (e) => { S.look = await A.lookAccent(e.target.value); toast('Saved'); } }),
          h('button', { class: 'btn', onclick: async () => { S.look = await A.lookAccent(''); toast('Back to blue'); draw(); } }, 'Reset'))),
      row('Lyrics in the pill', 'While a song plays, the line that is being sung shows in the small pill, and the pill is as wide as the line. It asks lrclib.net for the lyrics: only the title, artist and length of the song are sent. Works with YouTube, Spotify and other players that show up in the Windows media controls.', toggle(G.lyrics !== false, async (v) => { S.startup = await A.startupSet({ lyrics: v }); })),
      row('Screen-edge effect', 'A flash, a glow and rings on the edge of the one screen that becomes active when the pointer (or your head) moves control to this computer.',
        h('div', { style: 'display:flex;gap:10px;align-items:center' }, h('button', { class: 'btn', onclick: () => A.fxTest() }, 'Preview'), toggle(G.edgeFx !== false, async (v) => { S.startup = await A.startupSet({ edgeFx: v }); toast('Saved'); }))),
      row('Updates', updText(), h('div', { style: 'display:flex;gap:10px;align-items:center' },
        U.status === 'available' || U.status === 'ready' || U.status === 'downloading'
          ? h('button', { class: 'btn', disabled: U.status === 'downloading', onclick: () => A.updInstall() }, U.status === 'ready' ? 'Restart to update' : U.manual ? 'Open download page' : 'Update now')
          : h('button', { class: 'btn', disabled: U.status === 'checking', onclick: () => A.updCheck() }, 'Check for updates'))),
      row('About', 'A-tuls ' + (G.version || '') + '. Proprietary software. It includes open-source parts: Electron, ws, koffi, uiohook-napi, nut-js and MediaPipe (Apache-2.0). The full list is in THIRD-PARTY-NOTICES.md next to the app.', h('span', {}, ''))),
    h('div', { class: 'note' }, 'While two computers are linked, these settings follow each other: animation colors, start-up animation, screen-edge effect, edge resistance, game guard, Look to switch on/off, share clipboard and the screenshot options (on/off, format, size limit). These stay per computer: folders, mouse buttons, keyboard shortcuts, scroll feel, the wheel menu and the camera calibration.'),
  ];
}

function pageDiagnostics() {
  const msg = h('span', { class: 'msg' });
  return [
    h('h2', {}, 'Diagnostics'), h('div', { class: 'sub' }, 'A report of connection quality, pointer accuracy and recent events. Paste it when something does not work.'),
    h('div', { class: 'card' },
      row('Copy diagnostics', msg, h('button', { class: 'btn primary', onclick: async () => { const text = await A.diagReport(); try { await navigator.clipboard.writeText(text); msg.textContent = 'Copied to the clipboard'; } catch { msg.textContent = 'Could not copy'; } setTimeout(() => (msg.textContent = ''), 2500); } }, 'Copy')),
      row('Copy run log', 'Everything that happened (start-up, clicks, settings, connections, crossings, files, errors): the last 400 lines.', h('button', { class: 'btn', onclick: async () => { const text = await A.runlogTail(); try { await navigator.clipboard.writeText(text); msg.textContent = 'Run log copied (' + text.split(String.fromCharCode(10)).length + ' lines)'; } catch { msg.textContent = 'Could not copy'; } setTimeout(() => (msg.textContent = ''), 2500); } }, 'Copy')),
      row('Log folder', 'Settings, the diagnostics summary and the run log (island-run.log).', h('button', { class: 'btn', onclick: () => A.runlogOpen() }, 'Open'))),
  ];
}


// ---------------------------------------------------------------- calendar
// Google Calendar (and with it Android) and iCloud (iPhone) can each give out a secret link to a calendar in the iCal format. A-tuls reads the
// link, shows the events on the home page, and refreshes them every 15 minutes. Nothing is sent anywhere; the links are kept sealed on this computer.
let calList = [], calMsg = '', calBusy = false;
const calReload = async () => { try { calList = await A.calSources(); } catch {} if (page === 'calendar') draw(); };
function pageCalendar() {
  const name = h('input', { placeholder: 'Name (optional), e.g. Work', maxlength: 40 });
  const url = h('input', { placeholder: 'Paste the calendar link (https:// or webcal://)', style: 'flex:2' });
  const add = async () => {
    if (calBusy) return;
    calBusy = true; calMsg = 'Checking the link...'; draw();
    const r = await A.calAdd(name.value, url.value);
    calBusy = false; calMsg = r.ok ? 'Added' : r.error;
    await calReload(); draw();
  };
  return [
    h('h2', {}, 'Calendar'), h('div', { class: 'sub' }, 'Show your Google, Android or iPhone calendar on the home page.'),
    h('div', { class: 'card' },
      calList.length
        ? calList.map((c) => row(c.name, c.ok ? (c.count + ' events in the next weeks' + (c.at ? ', updated ' + new Date(c.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '')) : 'Problem: ' + c.error,
          h('button', { class: 'btn', onclick: async () => { calList = await A.calRemove(c.id); draw(); } }, 'Remove')))
        : row('No calendar yet', 'Add one below.', null),
      row('Add a calendar', calMsg || 'The link is secret: anybody who has it can read that calendar.', h('div', { class: 'row', style: 'gap:8px;flex:1;justify-content:flex-end' }, name, url, h('button', { class: 'btn primary', disabled: calBusy, onclick: add }, 'Add'))),
      row('Update now', 'Calendars update by themselves every 15 minutes.', h('button', { class: 'btn', disabled: calBusy, onclick: async () => { calBusy = true; draw(); calList = await A.calRefresh(); calBusy = false; draw(); } }, 'Refresh'))),
    h('div', { class: 'card' },
      h('div', { class: 'row' }, h('div', { class: 't' }, h('b', {}, 'Google Calendar and Android'),
        h('span', {}, 'On a computer open calendar.google.com. Settings (the gear) > pick the calendar on the left > Integrate calendar > copy "Secret address in iCal format". Android phones show the same Google calendar, so this is the one for them too.'))),
      h('div', { class: 'row' }, h('div', { class: 't' }, h('b', {}, 'iPhone (iCloud)'),
        h('span', {}, 'In the Calendar app tap Calendars, then the (i) next to a calendar, switch on Public Calendar, and copy the link. It starts with webcal://. Only that calendar is shared through the link; switch Public Calendar off to stop.')))),
  ];
}

// ---------------------------------------------------------------- shell
const PAGES = { calendar: pageCalendar, general: pageGeneral, pointer: pagePointer, scrolling: pageScrolling, trackpad: pageTrackpad, buttons: pageButtons, shortcuts: pageShortcuts, activation: pageActivation, appearance: pageAppearance, workspaces: pageWorkspaces, color: pageColor, sharing: pageSharing, diagnostics: pageDiagnostics };
// Search: every page builds its rows live, so the rows that match are taken from there (with their working controls) and shown together
let query = '';
const pageLabels = {};
if (MACOS) { const tp = document.querySelector('aside button[data-p="trackpad"]'); if (tp) tp.remove(); } // the trackpad of a Mac steers a PC: the page is for the PC
document.querySelectorAll('aside button[data-p]').forEach((b) => { pageLabels[b.dataset.p] = b.textContent.trim(); });
const goPage = (p) => { query = ''; $q.value = ''; page = p; A.log('settings page -> ' + page); $main.scrollTop = 0; draw(); };
function searchResults() {
  const toks = query.toLowerCase().split(/\s+/).filter(Boolean);
  const out = [h('h2', {}, 'Search'), h('div', { class: 'sub' }, 'Results for "' + query + '"')];
  let n = 0;
  for (const p of Object.keys(PAGES)) {
    let els = [];
    try { els = PAGES[p]().flat(); } catch { continue; }
    const holder = document.createElement('div');
    els.forEach((e) => e && holder.append(e));
    const rows = [...holder.querySelectorAll('.row')].filter((r) => { const t = r.textContent.toLowerCase(); return toks.every((k) => t.includes(k)); });
    const labelHit = toks.every((k) => (pageLabels[p] || '').toLowerCase().includes(k));
    if (!rows.length && !labelHit) continue;
    n += rows.length || 1;
    out.push(h('div', { class: 'group', style: 'cursor:pointer', title: 'Open this page', onclick: () => goPage(p) }, (pageLabels[p] || p) + '  \u203a'));
    out.push(rows.length ? h('div', { class: 'card' }, rows) : h('div', { class: 'card' }, h('div', { class: 'row' }, h('div', { class: 't' }, h('b', {}, pageLabels[p] || p), h('span', {}, 'Open this page')), h('button', { class: 'btn', onclick: () => goPage(p) }, 'Open'))));
  }
  if (!n) out.push(h('div', { class: 'note' }, 'No setting matches that.'));
  return out;
}
function draw() {
  document.querySelectorAll('aside button').forEach((b) => b.classList.toggle('on', !query && b.dataset.p === page));
  const y = $main.scrollTop;
  $main.innerHTML = '';
  if (S.perm === false) $main.append(h('div', { class: 'banner' }, 'Allow Accessibility and Input Monitoring for this app in System Settings, then it starts working automatically.'));
  $main.append(...(query ? searchResults() : (PAGES[page] || pagePointer)()).flat()); // some pages return nested lists (e.g. one card per workspace)
  $main.scrollTop = y;
  updateGaze();
}
const $q = document.getElementById('q');
document.querySelectorAll('aside button').forEach((b) => b.addEventListener('click', () => { goPage(b.dataset.p); }));
$q.addEventListener('input', () => { query = $q.value.trim(); $main.scrollTop = 0; draw(); });
$q.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $q.value = ''; query = ''; draw(); } });
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); $q.focus(); $q.select(); } });
A.onGaze((g) => { if (!S) return; S.gaze = g; updateGaze(); });
A.onColors((l) => { if (!S) return; S.colors = l; if (page === 'color') draw(); });
A.onPerm((ok) => { if (!S) return; S.perm = ok; draw(); });
A.onCal((l) => { calList = l; if (S && page === 'calendar') draw(); });
calReload();
A.updGet().then((u) => { U = u; if (S) draw(); }).catch(() => {});
A.onUpdate((u) => { U = u; if (S && page === 'general') draw(); });
Promise.all([window.rs.load(), A.startupGet(), A.prefsGet(), A.scrollGet(), A.tuneGet(), A.btnmapGet(), A.hotkeysGet(), A.clipGet(), A.shotGet(), A.gazeGet(), A.colorsGet(), A.permGet(), A.lookGet(), A.mediaBlockGet()]).then(([rs, startup, prefs, scroll, tune, map, hotkeys, clip, shot, gaze, colors, perm, look, mediaBlock]) => {
  S = { ...rs, look, mediaBlock, startup, prefs, scroll, tune, map, hotkeys, hkRows: hotkeys.map((x) => ({ ...x })), clip, shot, gaze, colors, perm };
  const want = new URLSearchParams(location.search).get('p');
  if (want && PAGES[want]) page = want; else page = 'general';
  A.log('settings window opened on ' + page);
  draw();
});
</script>
</body>
