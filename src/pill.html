<!doctype html>
<html><head><meta charset="utf-8"><style>
  html { zoom: 2; }
  body { margin: 0; background: transparent; font: 600 12px -apple-system, "SF Pro Text", sans-serif; color: #fff; }
  #pill { width: 150px; height: 22px; border-radius: 11px; background: #000; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  #dot { width: 6px; height: 6px; border-radius: 50%; background: #8e8e93; flex: none; }
  #dot.on { background: #30d158; }
</style></head>
<body><div id="pill"><span id="dot"></span><span id="txt">--:--</span></div>
<script>
  function set(s) {
    document.getElementById('dot').className = s.linked ? 'on' : '';
    document.getElementById('txt').textContent = s.linked ? '⇄ ' + String(s.name || '').slice(0, 14) : s.time;
  }
</script></body></html>
